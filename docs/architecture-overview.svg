<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">YouTFast architecture overview</title>
  <desc id="desc">Architecture diagram of YouTFast native client showing desktop inputs, core runtime binary, playback engine, backend, InnerTube API, and durable storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .group-label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .02em; }
      .box-title { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .client { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
      .server { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; rx: 22; }
      .route { fill: #ffffff; stroke: #a5b4fc; stroke-width: 1.5; rx: 14; }
      .boundary { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 14; }
      .player { fill: #ffe4e6; stroke: #f43f5e; stroke-width: 1.5; rx: 14; }
      .writer { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; rx: 14; }
      .reader { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 14; }
      .job { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 14; }
      .store { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 16; }
      .external { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 16; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #15803d; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .arrow-rose { fill: none; stroke: #e11d48; stroke-width: 2.2; marker-end: url(#arrow-rose); }
      .arrow-gold { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gold); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1400" height="920" />
  <text class="title" x="700" y="48" text-anchor="middle">YouTFast architecture overview</text>
  <text class="subtitle" x="700" y="76" text-anchor="middle">Native Rust + egui YouTube client; libmpv handles video playback; in-tree InnerTube handles YouTube APIs; platform stores handle durable state.</text>

  <!-- TOP TIER: CLIENTS & PLATFORM INTERFACES -->
  <text class="group-label" x="70" y="112">CLIENTS AND PLATFORMS</text>

  <rect class="client" x="60" y="130" width="290" height="118" />
  <text class="box-title" x="85" y="164">egui desktop UI</text>
  <text class="box-text" x="85" y="190">aspect-aware watch &amp; player</text>
  <text class="box-text" x="85" y="211">search, channels &amp; feeds</text>
  <text class="box-text" x="85" y="232">mini-player &amp; theater mode</text>

  <rect class="client" x="390" y="130" width="290" height="118" />
  <text class="box-title" x="415" y="164">Desktop and media</text>
  <text class="box-text" x="415" y="190">Linux MPRIS &amp; media keys</text>
  <text class="box-text" x="415" y="211">single-instance IPC server</text>
  <text class="box-text" x="415" y="232">SystemFonts discovery worker</text>

  <rect class="client" x="720" y="130" width="290" height="118" />
  <text class="box-title" x="745" y="164">Casting and remote TVs</text>
  <text class="box-text" x="745" y="190">Google Cast TV discovery</text>
  <text class="box-text" x="745" y="211">DIAL smart TV lifecycle</text>
  <text class="box-text" x="745" y="232">YouTube Lounge pairing</text>

  <rect class="external" x="1050" y="130" width="290" height="118" />
  <text class="box-title" x="1075" y="164">External providers</text>
  <text class="box-text" x="1075" y="190">SponsorBlock skip segments</text>
  <text class="box-text" x="1075" y="211">GitHub Releases updater</text>
  <text class="box-text" x="1075" y="232">yt-dlp extraction engine</text>

  <!-- MIDDLE CONTAINER: ONE NATIVE RUST BINARY -->
  <rect class="server" x="60" y="300" width="1280" height="390" />
  <text class="group-label" x="90" y="335">youtfast - one native Rust binary</text>

  <!-- ROW 1 INSIDE BINARY -->
  <rect class="route" x="90" y="365" width="250" height="100" />
  <text class="box-title" x="110" y="397">Views and rendering</text>
  <text class="box-text" x="110" y="423">egui immediate-mode layout</text>
  <text class="box-text" x="110" y="444">glow OpenGL blit callback</text>

  <rect class="route" x="370" y="365" width="250" height="100" />
  <text class="box-title" x="390" y="397">App state &amp; reducer</text>
  <text class="box-text" x="390" y="423">central App state container</text>
  <text class="box-text" x="390" y="444">action reducer &amp; slot tokens</text>

  <rect class="route" x="650" y="365" width="250" height="100" />
  <text class="box-title" x="670" y="397">Domain logic</text>
  <text class="box-text" x="670" y="423">recommendation ranking</text>
  <text class="box-text" x="670" y="444">history merge &amp; alert rules</text>

  <rect class="boundary" x="930" y="365" width="370" height="100" />
  <text class="box-title" x="955" y="397">Scope, auth, keyring</text>
  <text class="box-text" x="955" y="423">platform keyring secret store</text>
  <text class="box-text" x="955" y="444">in-memory session cookies only</text>

  <!-- ROW 2 INSIDE BINARY -->
  <rect class="player" x="90" y="535" width="275" height="110" />
  <text class="box-title" x="110" y="568">Playback engine (libmpv)</text>
  <text class="box-text" x="110" y="594">libmpv client C API (unsafe)</text>
  <text class="box-text" x="110" y="615">OpenGL FBO &amp; HW decoding</text>
  <text class="box-text" x="110" y="636">yt-dlp format extraction hook</text>

  <rect class="writer" x="395" y="535" width="285" height="110" />
  <text class="box-title" x="415" y="568">Backend runtime</text>
  <text class="box-text" x="415" y="594">Tokio multithreaded runtime</text>
  <text class="box-text" x="415" y="615">SaveGate atomic disk gate</text>
  <text class="box-text" x="415" y="636">request slots &amp; channels</text>

  <rect class="reader" x="710" y="535" width="285" height="110" />
  <text class="box-title" x="730" y="568">YouTube API &amp; network</text>
  <text class="box-text" x="730" y="594">in-tree InnerTube HTTP client</text>
  <text class="box-text" x="730" y="615">discovery, channel &amp; watch</text>
  <text class="box-text" x="730" y="636">Atom RSS, captions &amp; thumbs</text>

  <rect class="job" x="1025" y="535" width="275" height="110" />
  <text class="box-title" x="1045" y="568">Casting worker</text>
  <text class="box-text" x="1045" y="594">lazy serialized worker</text>
  <text class="box-text" x="1045" y="615">catt process launcher</text>
  <text class="box-text" x="1045" y="636">DIAL &amp; Lounge transport</text>

  <!-- BOTTOM TIER: DURABLE STATE -->
  <text class="group-label" x="70" y="735">DURABLE STATE (Local Files &amp; OS Store)</text>

  <rect class="store" x="60" y="755" width="290" height="120" />
  <text class="box-title" x="85" y="789">Library (library.json)</text>
  <text class="box-text" x="85" y="815">device subscriptions</text>
  <text class="box-text" x="85" y="836">watch history &amp; resume stamps</text>
  <text class="box-text" x="85" y="857">Watch later &amp; playlists</text>

  <rect class="store" x="390" y="755" width="290" height="120" />
  <text class="box-title" x="415" y="789">Settings (settings.json)</text>
  <text class="box-text" x="415" y="815">playback buffer &amp; quality</text>
  <text class="box-text" x="415" y="836">theme &amp; font preferences</text>
  <text class="box-text" x="415" y="857">SponsorBlock &amp; history opt-in</text>

  <rect class="store" x="720" y="755" width="290" height="120" />
  <text class="box-title" x="745" y="789">Thumbnail cache</text>
  <text class="box-text" x="745" y="815">bounded LRU (128 MiB)</text>
  <text class="box-text" x="745" y="836">max 2,000 image files</text>
  <text class="box-text" x="745" y="857">shared display/disk download</text>

  <rect class="store" x="1050" y="755" width="290" height="120" />
  <text class="box-title" x="1075" y="789">Platform keyring</text>
  <text class="box-text" x="1075" y="815">OS secret store service</text>
  <text class="box-text" x="1075" y="836">youtube-session-&lt;id&gt; key</text>
  <text class="box-text" x="1075" y="857">encrypted, zero disk persistence</text>

  <!-- ARROWS AND FLOWS -->
  <!-- Top to Middle -->
  <path class="arrow-blue" d="M 205 248 C 205 285 215 320 215 365" />
  <text class="small" x="125" y="287">egui frame rendering</text>

  <path class="arrow-blue" d="M 535 248 C 535 285 505 320 495 365" />
  <text class="small" x="455" y="287">IPC / media keys</text>

  <path class="arrow-blue" d="M 1162 535 C 1162 440 910 320 865 248" />
  <text class="small" x="975" y="287">local network cast</text>

  <!-- Inside Binary Top Row -->
  <path class="arrow" d="M 340 415 L 370 415" />
  <path class="arrow" d="M 620 415 L 650 415" />
  <path class="arrow" d="M 900 415 L 930 415" />
  <text class="small" x="945" y="488">session validation &amp; epoch dispatch</text>

  <!-- App to Backend & Player -->
  <path class="arrow-green" d="M 495 465 C 495 485 530 505 537 535" />
  <text class="small" x="350" y="500">async Commands / Events</text>

  <path class="arrow-rose" d="M 430 465 C 380 490 310 505 270 535" />
  <text class="small" x="200" y="515">playback controls</text>

  <path class="arrow-rose" d="M 227 535 C 227 510 215 485 215 465" />
  <text class="small" x="110" y="495">OpenGL FBO blit</text>

  <path class="arrow-blue" d="M 680 590 L 710 590" />

  <path class="arrow" d="M 995 590 L 1025 590" />

  <!-- Middle to Durable State -->
  <path class="arrow-green" d="M 480 645 C 440 685 280 715 230 755" />
  <text class="small" x="280" y="710">SaveGate atomic write</text>

  <path class="arrow-green" d="M 537 645 C 537 685 535 715 535 755" />

  <path class="arrow-blue" d="M 852 645 C 852 685 865 715 865 755" />

  <path class="arrow-gold" d="M 1115 465 C 1115 540 1195 660 1195 755" />
  <text class="small" x="1125" y="730">keyring secret I/O</text>

  <!-- External Provider Hooks -->
  <path class="arrow-dashed" d="M 1195 248 C 1225 340 1225 440 1195 535" />
  <path class="arrow-dashed" d="M 995 570 C 1045 540 1130 400 1150 248" />
  <text class="small" x="1205" y="390">yt-dlp hook / SponsorBlock</text>

  <!-- LEGEND -->
  <text class="small" x="70" y="900">Solid arrows show runtime request, event, and command dispatch. Dashed arrows show background extraction hooks and encrypted keyring access.</text>
</svg>
