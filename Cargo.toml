[package]
name = "youtfast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "A native YouTube client built with Rust, egui and libmpv"
repository = "https://github.com/bcosta19/youtfast"
readme = "README.md"
publish = false
keywords = ["youtube", "video", "egui", "mpv", "player"]
categories = ["multimedia::video"]

[[bin]]
name = "youtfast"
path = "src/main.rs"

[features]
demo = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Rotated local logs; all messages pass the application privacy redactor.
env_logger = "0.11"
# The whole UI, as in Spotifast and ZapFast. glow, not wgpu: the video is
# drawn by libmpv's OpenGL renderer into a texture egui_glow blits on screen.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
# `http` fetches thumbnails from i.ytimg.com through egui's image loaders;
# `file` answers the ones the disk cache already kept (src/thumbs.rs).
# `svg` draws the icons.
egui_extras = { version = "0.36", features = ["file", "http", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# The wl_display or X11 Display handed to libmpv, so hardware decoding can
# share frames with the GL context instead of copying them back.
raw-window-handle = "0.6"
# The backend runtime: yt-dlp runs as a child process off the UI thread.
# `time` bounds credential-store calls; a locked keyring must not hang.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "process", "io-util", "time"] }
# The icons! table and the Lucide icons shared with the sibling apps.
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Inter at its four weights (or the platform's interface face), with the
# installed faces behind it for the scripts Inter lacks, as in the siblings.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# How the desktop renders text (hinting, coverage), applied to egui's.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Bundled translations, compiled from gettext catalogs; no runtime files.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Palette files, the shared palettes, and following the Omarchy desktop's
# theme live.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# One running copy per user; a second launch hands its request over.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The desktop's media controls: MPRIS on Linux, media keys and panels.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# YouTube's own API (InnerTube): the signed-in account's feed, history,
# subscriptions, playlists, liked videos and Watch later (`userdata`), and
# channel RSS for the feed without an account (`rss`). rustls, as in the
# sibling apps, so there is no OpenSSL to link.
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots", "userdata", "rss"] }
# Where the library and caches live (XDG on Linux).
directories = "6"
# Google Takeout's RFC 3339 times.
jiff = "0.2"
# Desktop notifications for new uploads (zbus for the D-Bus, no glib).
# Desktop notifications for new uploads; "z" is zbus for the D-Bus.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Native file selection (desktop portal on Linux) for Takeout and cookies.txt.
rfd = "0.17.2"
# The signed-in session's cookies live in the platform credential store,
# never in a file. One API, with each target's native provider below.
keyring-core = "1"
ehttp = "0.7"
# Thumbnails download through one agent of ehttp's own HTTP client, at the
# same version and features, so their connections stay open between them.
ureq = "3"
# The window's icon, drawn from packaging/icons as in ZapFast.
resvg = { version = "0.45", default-features = false }
# SponsorBlock's lookups name a prefix of the video id's SHA-256, not the id.
sha2 = "0.11"

# libmpv is linked from the system (src/mpv/ffi.rs). On Arch it comes with the
# `mpv` package; Debian and Ubuntu need `libmpv-dev` to build.

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
# rustypipe takes a reqwest ClientBuilder (`build_with_client`); tests point
# it at a closed proxy. The version rustypipe already locks, no new crate.
reqwest = { version = "0.12", default-features = false }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1", features = ["build"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Image decoding and immediate-mode layout are too slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# CI only checks and tests, so it skips the optimised dependencies and the
# debug info the interactive profile carries.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

[patch.crates-io]
# crmne/egui apps-0.36 and crmne/winit apps-0.30, the same revisions Spotifast
# and ZapFast pin: Wayland frame pacing by the compositor's frame callbacks
# (a window Hyprland hides never blocks in a vsync swap), plus the clipboard
# and accessibility fixes listed in those projects' Cargo.toml. Move all of
# them together with the sibling apps.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
# rustypipe 0.11.4 with ThetaDev/rustypipe PR #80 applied (codeberg.org):
# comment authors' avatars, which YouTube now sends as
# `author.avatarThumbnailUrl`, and the comment count from the engagement
# panel, plus image/GIF attachments on comments. It also returns a failed
# visitor-data fetch as an error: upstream unwraps it, and a panic aborts the
# release build (`panic = "abort"`). Channel tabs follow YouTube's October
# 2026 layout: the sort chips' continuation token and the Shorts items'
# `thumbnailViewModel`, without which every Short was dropped. Drop the copy
# once a release carries these changes.
rustypipe = { path = "vendor/rustypipe" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
