[workspace]
resolver = "3"
members = ["crates/youtfast"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/bcosta19/youtfast"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Rotated local logs; all messages pass the application privacy redactor.
env_logger = "0.11"
# The whole UI, as in Spotifast and ZapFast. glow, not wgpu: the video is
# drawn by libmpv's OpenGL renderer into a texture egui_glow blits on screen.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
# `http` fetches thumbnails from i.ytimg.com through egui's image loaders;
# `file` answers the ones the disk cache already kept (crates/youtfast/src/youtube/thumbs.rs).
# `svg` draws the icons.
egui_extras = { version = "0.36", features = ["file", "http", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# The wl_display or X11 Display handed to libmpv, so hardware decoding can
# share frames with the GL context instead of copying them back.
raw-window-handle = "0.6"
# The backend runtime: yt-dlp runs as a child process off the UI thread.
# `time` bounds credential-store calls; a locked keyring must not hang.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "process", "io-util", "time", "net"] }
# Native discovery of YouTube DIAL TVs, including Samsung AirPlay adverts.
mdns-sd = { version = "0.21.6", default-features = false, features = ["async"] }
# Already in the tree through mdns-sd: per-interface SSDP searches.
if-addrs = "0.15"
socket2 = "0.6"
quick-xml = "0.41"
# The icons! table and the Lucide icons shared with the sibling apps.
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# Inter at its four weights (or the platform's interface face), with the
# installed faces behind it for the scripts Inter lacks, as in the siblings.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# How the desktop renders text (hinting, coverage), applied to egui's.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# Bundled translations, compiled from gettext catalogs; no runtime files.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# Palette files, the shared palettes, and following the Omarchy desktop's
# theme live.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# One running copy per user; a second launch hands its request over.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# The desktop's media controls: MPRIS on Linux, media keys and panels.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# The wheel step, the Linux touchpad scale and glide, and the axis a scroll
# gesture holds.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
# YouTube's own API (InnerTube): the signed-in account's feed, history,
# subscriptions, playlists, liked videos and Watch later (`userdata`), and
# channel RSS for the feed without an account (`rss`). rustls, as in the
# sibling apps, so there is no OpenSSL to link.
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots", "userdata", "rss"] }
# Where the library and caches live (XDG on Linux).
directories = "6"
# Google Takeout's RFC 3339 times.
jiff = "0.2"
# History playback reports use yt-dlp's random client playback nonce.
rand = "0.10"
url = "2"
# Desktop notifications for new uploads (zbus for the D-Bus, no glib).
# Desktop notifications for new uploads; "z" is zbus for the D-Bus.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Native file selection (desktop portal on Linux) for Takeout and cookies.txt.
rfd = "0.17.2"
# The signed-in session's cookies live in the platform credential store,
# never in a file. One API, with each target's native provider below.
keyring-core = "1"
ehttp = "0.7"
# Thumbnails download through one agent of ehttp's own HTTP client, at the
# same version and features, so their connections stay open between them.
ureq = "3"
# The window's icon, drawn from packaging/icons as in ZapFast.
resvg = { version = "0.45", default-features = false }
# SponsorBlock's lookups name a prefix of the video id's SHA-256, not the id.
sha2 = "0.11"
# rustypipe's HTTP client checks certificates through the operating system
# (`innertube::http`): a fresh Windows keeps few roots and fetches the rest
# only when its own verifier asks. reqwest is the version rustypipe locks;
# rustls and its ring provider are the ones reqwest already builds.
reqwest = { version = "0.13", default-features = false, features = ["form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.6"
# Each target's native credential store provider for keyring-core.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = { version = "1.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Image decoding and immediate-mode layout are too slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# CI only checks and tests, so it skips the optimised dependencies and the
# debug info the interactive profile carries.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

[patch.crates-io]
# crmne/egui apps-0.36.2 and crmne/winit apps-0.30, the same revisions Spotifast
# and ZapFast pin: Wayland frame pacing by the compositor's frame callbacks
# (a window Hyprland hides never blocks in a vsync swap), plus the clipboard
# and accessibility fixes listed in those projects' Cargo.toml. Move all of
# them together with the sibling apps.
ecolor = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
eframe = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
egui = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
emath = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
epaint = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
# rustypipe 0.11.4 from YouTFast's fork (github.com/bcosta19/rustypipe, branch
# `youtfast`; its README lists the changes and each commit names the YouTFast
# change it comes from): ThetaDev/rustypipe PR #80 (comment authors' avatars,
# the comment count, image/GIF attachments), a failed visitor-data fetch
# returned as an error instead of a panic (`panic = "abort"` would end the
# release build), channel pages in YouTube's October 2026 layout, history
# playback reports, reqwest 0.13 with rustls and ring, and the `regression`
# hooks. Move `rev` to fix a YouTube format there; drop the fork once an
# upstream release carries these changes.
rustypipe = { git = "https://github.com/bcosta19/rustypipe", rev = "d6073def4a320929c08fc18b345812f540853c50" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "1cc61c8a83625855b08cb8fed912900cf3b01b70" }
winit = { git = "https://github.com/crmne/winit", rev = "59ebfb727b8c83fcd28f8ca59c3733e32b4b4e9b" }
