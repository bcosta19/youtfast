[package]
name = "youtfast"
description = "A native YouTube client built with Rust, egui and libmpv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["youtube", "video", "egui", "mpv", "player"]
categories = ["multimedia::video"]

[[bin]]
name = "youtfast"
path = "src/main.rs"

[features]
# The offline UI harness (src/demo.rs) and the synthetic images it draws.
demo = ["youtfast-app/demo", "youtfast-ui/demo"]

[dependencies]
youtfast-app.workspace = true
youtfast-ui.workspace = true
youtfast-desktop.workspace = true
youtfast-cast.workspace = true
youtfast-youtube.workspace = true
youtfast-storage.workspace = true
youtfast-appearance.workspace = true
youtfast-core.workspace = true
youtfast-mpv.workspace = true
youtfast-i18n.workspace = true
clap.workspace = true
serde_json.workspace = true
log.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
fastframe-icons.workspace = true
url.workspace = true
rfd.workspace = true
resvg.workspace = true

[lints]
workspace = true
