version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      egui:
        patterns:
          - egui*
          - eframe
          - ecolor
          - epaint*
          - winit
      fastframe:
        patterns:
          - fastframe-*
