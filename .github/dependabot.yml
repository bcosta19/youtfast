version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns:
          - egui*
          - eframe
          - ecolor
          - epaint*
          - winit
      fastframe:
        patterns:
          - fastframe-*
