name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate and package without publishing
        required: true
        default: v0.4.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            python3 packaging/release.py check --tag "$RELEASE_TAG" --candidate
          else
            python3 packaging/release.py check --tag "$RELEASE_TAG"
          fi
          if [ "$RELEASE_EVENT" = push ]; then
            git merge-base --is-ancestor HEAD origin/main
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
          fi

  # Packages build in parallel with CI; assembly and the draft still need both.
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      # As in CI: no Recommends, and a stuck mirror fails here. No package
      # cache: release builds restore nothing.
      - name: System dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 build-essential pkg-config libmpv-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libfontconfig1-dev libssl-dev xvfb xdotool imagemagick dbus-x11 libgl1-mesa-dri
      - name: Build without restored compiler output
        run: cargo build --release --locked
      - name: Verify and package Linux executable
        run: |
          test "$(target/release/youtfast --version)" = "youtfast $(python3 packaging/release.py check)"
          ldd target/release/youtfast
          ! ldd target/release/youtfast | grep 'not found'
          python3 packaging/release.py linux
      - name: Capture fresh signed-out profile
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/youtfast-preview/config" "$RUNNER_TEMP/youtfast-preview/data" "$RUNNER_TEMP/youtfast-preview/cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/youtfast-preview/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/youtfast-preview/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/youtfast-preview/cache"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x1000x24' bash -e -c '
            target/release/youtfast &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 5
            kill -0 "$app"
            window=$(xdotool search --onlyvisible --name "^YouTFast$")
            import -window "$window" "dist/youtfast-$RELEASE_TAG-linux.png"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.png
          if-no-files-found: error
          retention-days: 7

  source:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: Archive corresponding source and dependency licenses
        run: python3 packaging/release.py source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source
          path: dist/*-source-with-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 7

  arch:
    needs: [validate, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # Official Arch image, digest verified 2026-10-17; review updates.
      image: archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    steps:
      - name: Install signed distribution build/runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python rust namcap mpv yt-dlp deno libxkbcommon libxkbcommon-x11 wayland libglvnd fontconfig openssl pkgconf
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source
          path: dist
      - name: Generate exact source recipe and build as an unprivileged user
        run: |
          # The container user does not own the runner's checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 packaging/arch.py "dist/youtfast-$RELEASE_TAG-source-with-dependencies.tar.gz"
          cp -a dist/aur/youtfast /home/builder/youtfast
          cp "dist/youtfast-$RELEASE_TAG-source-with-dependencies.tar.gz" /home/builder/youtfast/
          chown -R builder:builder /home/builder/youtfast
          # The test suite already ran in CI; check() stays for AUR users.
          runuser -u builder -- bash -e -c 'cd /home/builder/youtfast && makepkg --verifysource && makepkg --cleanbuild --nocheck --noconfirm && makepkg --printsrcinfo > .SRCINFO'
      - name: Install candidate and validate package metadata
        run: |
          cp /home/builder/youtfast/*.pkg.tar.zst dist/
          cp /home/builder/youtfast/.SRCINFO dist/aur/youtfast/.SRCINFO
          namcap dist/aur/youtfast/PKGBUILD dist/*.pkg.tar.zst
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test "$(youtfast --version)" = "youtfast ${RELEASE_TAG#v}"
          tar -czf "dist/youtfast-$RELEASE_TAG-aur.tar.gz" -C dist/aur youtfast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/*-aur.tar.gz
          if-no-files-found: error
          retention-days: 7

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: dist
      - name: Install builder and runtime
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y -o Acquire::Retries=3 flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build restricted bundle and native corresponding sources
        run: |
          mkdir packaging/flatpak/built
          tar -xzf "dist/youtfast-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz" -C packaging/flatpak/built --strip-components=1
          flatpak-builder --user --install --repo=repo --default-branch=stable --bundle-sources build-dir packaging/flatpak/io.github.bcosta19.YouTFast.json
          flatpak run io.github.bcosta19.YouTFast --version
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo "dist/youtfast-$RELEASE_TAG-x86_64.flatpak" io.github.bcosta19.YouTFast stable
          flatpak build-bundle --runtime repo "dist/youtfast-$RELEASE_TAG-flatpak-sources.flatpak" io.github.bcosta19.YouTFast.Sources stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-python
      - name: Build, bundle imported DLLs and record native dependencies
        shell: msys2 {0}
        run: |
          export LIBRARY_PATH=/ucrt64/lib
          cargo build --release --locked --target x86_64-pc-windows-gnu
          python packaging/bundle.py windows --binary target/x86_64-pc-windows-gnu/release/youtfast.exe --prefix "$(cygpath -m /ucrt64)"
          python packaging/native_sources.py windows "dist/youtfast-$RELEASE_TAG-x86_64-pc-windows-gnu"
      - name: Extract and smoke test outside the build toolchain PATH
        shell: pwsh
        run: |
          $archive = Get-Item "dist/youtfast-$env:RELEASE_TAG-x86_64-pc-windows-gnu.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP 'youtfast-windows-smoke'
          Expand-Archive $archive.FullName $unpacked
          $exe = Get-ChildItem $unpacked -Filter youtfast.exe -Recurse | Select-Object -First 1
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # A GUI-subsystem executable is not awaited by `&`; redirect explicitly.
          $out = Join-Path $env:RUNNER_TEMP 'youtfast-version.txt'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          $actual = (Get-Content $out -Raw).Trim()
          if ($process.ExitCode -ne 0 -or $actual -ne "youtfast $($env:RELEASE_TAG.Substring(1))") { throw "Packaged Windows startup failed: exit $($process.ExitCode), output '$actual'" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows
          path: |
            dist/*-x86_64-pc-windows-gnu.zip
            dist/*-windows-native-sources.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler and native packaging tools
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          brew install mpv dylibbundler
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build and bundle application with libmpv
        run: |
          cargo build --release --locked
          python3 packaging/bundle.py macos --binary target/release/youtfast
          python3 packaging/native_sources.py macos "dist/youtfast-$RELEASE_TAG-aarch64-apple-darwin"
      - name: Extract and smoke test packaged application
        run: |
          mkdir -p "$RUNNER_TEMP/youtfast-macos-smoke"
          ditto -x -k "dist/youtfast-$RELEASE_TAG-aarch64-apple-darwin.zip" "$RUNNER_TEMP/youtfast-macos-smoke"
          app="$RUNNER_TEMP/youtfast-macos-smoke/youtfast-$RELEASE_TAG-aarch64-apple-darwin/YouTFast.app"
          codesign --verify --deep --strict "$app"
          test "$("$app/Contents/MacOS/youtfast" --version)" = "youtfast ${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos
          path: |
            dist/*-aarch64-apple-darwin.zip
            dist/*-macos-native-sources.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [checks, linux, source, arch, flatpak, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Require every platform, generate channel manifests and checksum candidates
        run: |
          test -s "dist/youtfast-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
          test -s "dist/youtfast-$RELEASE_TAG-source-with-dependencies.tar.gz"
          test -s "dist/youtfast-$RELEASE_TAG-x86_64.flatpak"
          test -s "dist/youtfast-$RELEASE_TAG-flatpak-sources.flatpak"
          test -s "dist/youtfast-$RELEASE_TAG-linux.png"
          test -s "dist/youtfast-$RELEASE_TAG-aur.tar.gz"
          test -s "dist/youtfast-${RELEASE_TAG#v}-1-x86_64.pkg.tar.zst"
          test -s "dist/youtfast-$RELEASE_TAG-x86_64-pc-windows-gnu.zip"
          test -s "dist/youtfast-$RELEASE_TAG-aarch64-apple-darwin.zip"
          test -s "dist/youtfast-$RELEASE_TAG-windows-native-sources.tar.gz"
          test -s "dist/youtfast-$RELEASE_TAG-macos-native-sources.tar.gz"
          python3 packaging/channels.py dist
          test -s "dist/youtfast-$RELEASE_TAG-channels.tar.gz"
          rm -rf dist/channels
          (cd dist && sha256sum *.tar.gz *.flatpak *.png *.zip *.pkg.tar.zst > checksums.txt && sha256sum --check checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checksums
          path: |
            dist/checksums.txt
            dist/*-channels.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Verify candidates and create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "YouTFast ${RELEASE_TAG#v}" --notes-file "packaging/release-notes/$RELEASE_TAG.md"
