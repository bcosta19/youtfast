name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/build_site.py'
      - 'tools/site_locale.py'
      - 'tools/test_site.py'
      - 'assets/demo/youtfast-demo.mp4'
      - 'packaging/icons/youtfast.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: website-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate and build public site
        run: |
          python3 -m unittest discover -s tools -p 'test_site.py'
          python3 tools/build_site.py
