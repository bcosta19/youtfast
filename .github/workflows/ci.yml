name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Preserve the private-repository pause unless explicitly opted in.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: linux-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      # Ubuntu's packages come from Actions' cache once downloaded:
      # libmpv-dev alone pulls in some 115 MB (ffmpeg's development stack),
      # and the runners' mirror has served it at 43 kB/s. apt checks each
      # cached .deb against the signed index and fetches only what changed.
      # Recommends stay out; a stuck mirror fails here, not in Clippy.
      - name: Restore Ubuntu packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-ubuntu-24.04-
      - name: System dependencies
        timeout-minutes: 30
        run: |
          archives="$HOME/apt-archives"
          sudo mkdir -p "$archives/partial"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::Archives="$archives" build-essential pkg-config libmpv-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfontconfig1-dev libssl-dev desktop-file-utils appstream
          sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Save Ubuntu packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: linux-quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Packaging regressions and release metadata
        run: |
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 packaging/release.py check
          desktop-file-validate packaging/applications/youtfast.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.bcosta19.YouTFast.metainfo.xml
      - name: Formatting
        run: cargo fmt --all --check
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Clippy
        run: cargo clippy --locked --profile ci --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --profile ci --all-targets --all-features

  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: macos-native-tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler and libmpv
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: macos15-tests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --profile ci --all-targets --all-features
      - name: Build and version smoke test
        run: |
          cargo build --locked --profile ci
          test "$(target/ci/youtfast --version)" = "youtfast $(python3 packaging/release.py check)"

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: windows-native-tests
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-mpv
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-gnu-tests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Native build and headless tests
        shell: msys2 {0}
        run: |
          export LIBRARY_PATH=/ucrt64/lib
          cargo test --locked --profile ci --all-targets --all-features --target x86_64-pc-windows-gnu
          cargo build --locked --profile ci --target x86_64-pc-windows-gnu
          target/x86_64-pc-windows-gnu/ci/youtfast.exe --version

  release-gate:
    name: release-gate
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform check
        env:
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: test "$LINUX" = success && test "$MACOS" = success && test "$WINDOWS" = success
