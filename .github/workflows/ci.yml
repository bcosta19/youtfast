name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Preserve the private-repository pause unless explicitly opted in.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: linux-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      # Ubuntu's packages come from Actions' cache once downloaded:
      # libmpv-dev alone pulls in some 115 MB (ffmpeg's development stack),
      # and the runners' mirror has served it at 43 kB/s. apt checks each
      # cached .deb against the signed index and fetches only what changed.
      # Recommends stay out; a stuck mirror fails here, not in Clippy.
      - name: Restore Ubuntu packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-ubuntu-24.04-
      - name: System dependencies
        timeout-minutes: 30
        run: |
          archives="$HOME/apt-archives"
          sudo mkdir -p "$archives/partial"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::Archives="$archives" build-essential pkg-config libmpv-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfontconfig1-dev libssl-dev desktop-file-utils appstream
          sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Save Ubuntu packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: linux-quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Packaging regressions and release metadata
        run: |
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 packaging/release.py check
          desktop-file-validate packaging/applications/youtfast.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.bcosta19.YouTFast.metainfo.xml
      - name: Formatting
        run: cargo fmt --all --check
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Clippy
        run: cargo clippy --locked --profile ci --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --profile ci --all-targets --all-features

  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: macos-native-tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler and libmpv
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          brew install mpv dylibbundler deno yt-dlp
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: macos15-tests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --profile ci --all-targets --all-features
      - name: Build, package Homebrew Cask and verify simulated download and installation
        run: |
          cargo build --locked --profile ci
          ver=$(python3 packaging/release.py check)
          test "$(target/ci/youtfast --version)" = "youtfast $ver"
          python3 packaging/bundle.py macos --binary target/ci/youtfast
          archive="dist/youtfast-v$ver-aarch64-apple-darwin.zip"
          sha=$(shasum -a 256 "$archive" | awk '{print $1}')
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          srv=$!
          trap "kill $srv 2>/dev/null || true" EXIT
          sleep 1
          brew tap-new --no-git local/youtfast-test
          tap_dir="$(brew --repository local/youtfast-test)/Casks"
          mkdir -p "$tap_dir"
          python3 -c 'import sys; sys.path.insert(0, "packaging"); import channels; print(channels.render_homebrew_cask(sys.argv[1], sys.argv[2], archive_url=sys.argv[3]))' \
            "$ver" "$sha" "http://127.0.0.1:8765/youtfast-v#{version}-aarch64-apple-darwin.zip" > "$tap_dir/youtfast.rb"
          brew install --cask local/youtfast-test/youtfast
          codesign --verify --deep --strict "/Applications/YouTFast.app"
          test "$("/Applications/YouTFast.app/Contents/MacOS/youtfast" --version)" = "youtfast $ver"
          test "$(youtfast --version)" = "youtfast $ver"

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true'
    name: windows-native-tests
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-python
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-gnu-tests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Native build, headless tests and Winget package bundle
        shell: msys2 {0}
        run: |
          export LIBRARY_PATH=/ucrt64/lib
          cargo test --locked --profile ci --all-targets --all-features --target x86_64-pc-windows-gnu
          cargo build --locked --profile ci --target x86_64-pc-windows-gnu
          python packaging/bundle.py windows --binary target/x86_64-pc-windows-gnu/ci/youtfast.exe --prefix "$(cygpath -m /ucrt64)"
      - name: Simulate Winget download, SHA-256 verification and clean-environment execution
        shell: pwsh
        run: |
          $ver = (python packaging/release.py check).Trim()
          $archive = Get-Item "dist/youtfast-v$ver-x86_64-pc-windows-gnu.zip"
          $sha = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--directory','dist' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $url = "http://127.0.0.1:8765/youtfast-v$ver-x86_64-pc-windows-gnu.zip"
            $manifestPath = Join-Path $env:RUNNER_TEMP 'bcosta19.YouTFast.yaml'
            python -c "import sys; sys.path.insert(0, 'packaging'); import channels; open(sys.argv[4], 'w').write(channels.render_winget(sys.argv[1], sys.argv[2], installer_url=sys.argv[3]))" $ver $sha $url $manifestPath
            $downloaded = Join-Path $env:RUNNER_TEMP 'downloaded-youtfast.zip'
            Invoke-WebRequest -Uri $url -OutFile $downloaded
            $actualSha = (Get-FileHash $downloaded -Algorithm SHA256).Hash
            if ($actualSha -ne $sha) { throw "SHA-256 mismatch: $actualSha != $sha" }
            $installRoot = Join-Path $env:RUNNER_TEMP 'winget-portable-install'
            Expand-Archive $downloaded $installRoot
            $exe = Join-Path $installRoot "youtfast-v$ver-x86_64-pc-windows-gnu\youtfast.exe"
            if (-not (Test-Path $exe)) { throw "Missing NestedInstallerFile: $exe" }
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $out = Join-Path $env:RUNNER_TEMP 'youtfast-version.txt'
            $proc = Start-Process -FilePath $exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
            $actual = (Get-Content $out -Raw).Trim()
            if ($proc.ExitCode -ne 0 -or $actual -ne "youtfast $ver") { throw "Installed Windows execution failed: exit $($proc.ExitCode), output '$actual'" }
            Write-Host "Windows Winget simulated download, install and execution verified: $actual"
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

  release-gate:
    name: release-gate
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.YOUTFAST_AUTOMATIC_CI == 'true')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform check
        env:
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: test "$LINUX" = success && test "$MACOS" = success && test "$WINDOWS" = success
